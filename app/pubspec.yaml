name: khachsan_di_dong
description: Phần mềm theo dõi trạng thái phòng khách sạn theo thời gian thực.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/login/
