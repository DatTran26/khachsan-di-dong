name: Task
description: Track one WBS task with evidence and acceptance criteria
title: "Sx-OWNER-NNN: "
labels: ["type:task"]
body:
  - type: input
    id: wbs_id
    attributes:
      label: WBS ID
      description: Mã bất biến, ví dụ S2-BAO-014.
      placeholder: Sx-OWNER-NNN
    validations:
      required: true
  - type: dropdown
    id: sprint
    attributes:
      label: Sprint
      options:
        - S1
        - S2
        - S3
        - S4
    validations:
      required: true
  - type: input
    id: workstream
    attributes:
      label: Workstream
      description: Discovery, Architecture, Backend, Flutter, Operations, Dashboard, AI, QA, DevOps hoặc Project management.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Repo, branch, files, constraints.
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Người thực hiện task.
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Reviewer hoặc acceptance owner
      description: Người xác nhận trước Done.
    validations:
      required: true
  - type: input
    id: target_date
    attributes:
      label: Target date
      placeholder: YYYY-MM-DD
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Điều kiện quan sát được để chuyển Done; ghi rõ UAT, sign-off hoặc reviewer approval.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence links
      description: PR/commit, test/CI, artefact hoặc UAT/sign-off. PR merge vào develop không tự chuyển Done.
